<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navratri Stall POS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Navratri POS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#173d2e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#faf6ea;--card:#fffdf7;--ink:#1d2a23;--mute:#6e6b5a;--pri:#1f4d3a;--pri2:#eee7d1;--line:#ddd0ab;--ok:#2e6b4f;--blue:#1f3a5f;--gold:#b08d3c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font-family:inherit}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 8px;background:#173d2e;color:#f3e7c3;border-bottom:3px solid var(--gold)}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
header small{color:#e4d29c;font-size:13px;font-weight:700;text-align:right;line-height:1.3}header small span{display:block;font-size:17px}
nav{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
nav button{flex:1;padding:9px 2px;border:0;border-radius:10px;background:var(--pri2);color:var(--ink);font-weight:600;font-size:13px}
nav button.on{background:var(--pri);color:#f3e7c3}
main{flex:1;min-height:0;overflow:hidden}
.pos{display:flex;height:100%}
.left{flex:.8;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;border-right:1px solid var(--line)}
.right{flex:1.35;display:flex;flex-direction:column;padding:10px;min-width:0;background:var(--card)}
.item{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px;font-size:13px;font-weight:600}
.item:active{background:var(--pri2)}
.item span{display:block;color:var(--gold);font-weight:700;font-size:13px;margin-top:2px}
.item b{position:absolute;top:6px;right:6px;background:var(--pri);color:#fff;border-radius:999px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px}
.cat{font-size:11px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:4px 2px 0}
.cart{flex:1;overflow-y:auto}
.line{border-bottom:1px dashed var(--line);padding:9px 0;font-size:15px}
.line .n{font-weight:600}
.line .r{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.q{display:flex;align-items:center;gap:6px}
.q button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;line-height:1}
.empty{color:var(--mute);text-align:center;margin-top:30px;font-size:13px}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:8px 0}
.pay{display:flex;gap:6px}
.pay button{flex:1;padding:16px 2px;border:0;border-radius:12px;color:#fff;font-weight:700;font-size:15px}
.cash{background:var(--ok)}.gpay{background:var(--blue)}
.pay button:disabled{opacity:.35}
.clr{margin-top:6px;border:0;background:none;color:var(--mute);font-size:12px;padding:6px}
.page{height:100%;overflow-y:auto;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mut{color:var(--mute);font-size:12px}
input,select{font:inherit;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.btn{border:0;border-radius:9px;padding:9px 12px;background:var(--pri);color:#fff;font-weight:700;font:inherit;font-weight:700}
.btn.g{background:var(--pri2);color:var(--pri)}
.btn.d{background:#8b2e2e;color:#fff}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
.pill.c{background:var(--ok)}.pill.o{background:var(--blue)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .v{font-size:20px;font-weight:800}
.stat.big{grid-column:span 2;background:var(--pri);color:#fff;border:0}
.stat.big .mut{color:#e4d29c}.stat.big{border-bottom:3px solid var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
h3{margin:12px 0 6px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(20,30,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.ov.s{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--gold)}
.sheet h2{margin:0 0 4px;font-size:20px;color:var(--pri)}
.sheet ol{padding-left:20px;line-height:1.8;font-size:15px;margin:10px 0}
.sheet .ic{width:56px;height:56px;border-radius:14px;float:right;margin-left:10px}
.sheet .btn{width:100%;margin-top:6px;padding:13px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.s{opacity:1}
</style>
</head>
<body>
<header><h1 id="sn">Navratri Stall</h1><small id="dt"></small></header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="ov" id="ov"><div class="sheet"><img class="ic" id="icn" alt=""><h2>Add to Home Screen</h2><div class="mut">Open the stall app like a normal app, in one tap.</div><div id="steps"></div><button class="btn" id="inb" style="display:none" onclick="doInstall()">Install app</button><button class="btn g" onclick="closeInst(true)">Not now</button></div></div>
<script>
/* ===== EASY SETTINGS: change these ===== */
var CONFIG={
 stallName:'Navratri Stall',
 currency:'₹',
 // [name, price, category] - used only the FIRST time the app opens on a phone
 defaultItems:[['Simple Ghoghra',50,'Ghoghra'],['Cheese Ghoghra',70,'Ghoghra'],['Salted Fries',60,'French Fries'],['Peri Peri Fries',80,'French Fries'],['Korean Fries',90,'French Fries'],['Water Bottle',20,'Beverage']]
};
/* ===== END SETTINGS ===== */
var KI='navratri_items_v1',KS='navratri_sales_v1';
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var defaults=CONFIG.defaultItems;
var items=load(KI,null)||defaults.map(function(d,i){return{id:'d'+i,name:d[0],price:d[1],cat:d[2]}});
var sales=load(KS,[]);
var cart={},tab='sale',viewDate=today(),armed=null;
function pad(n){return n<10?'0'+n:''+n}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return dstr(new Date())}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nice(s){var p=s.split('-');return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function tm(ts){return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast s';setTimeout(function(){t.className='toast'},1400)}
document.getElementById('sn').textContent=CONFIG.stallName;
function tick(){var n=new Date();document.getElementById('dt').innerHTML=nice(today())+'<span>'+n.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</span>'}
setInterval(tick,1000);
function setTab(t){tab=t;armed=null;render()}
function render(){
 tick();
 var tabs=[['sale','Sale'],['hist','Orders'],['rep','Report'],['items','Items']];
 document.getElementById('nav').innerHTML=tabs.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
 var m=document.getElementById('main');
 m.innerHTML=tab=='sale'?saleV():tab=='hist'?histV():tab=='rep'?repV():itemsV();
}
/* SALE */
function saleV(){
 var cats=[],h='';
 items.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat)});
 cats.forEach(function(c){h+='<div class="cat">'+esc(c)+'</div>';items.filter(function(i){return i.cat==c}).forEach(function(i){
  h+='<button class="item" onclick="add(\''+i.id+'\')">'+esc(i.name)+'<span>₹'+i.price+'</span>'+(cart[i.id]?'<b>'+cart[i.id]+'</b>':'')+'</button>'})});
 var ids=Object.keys(cart),tot=0,l='';
 ids.forEach(function(id){var it=items.find(function(x){return x.id==id});if(!it)return;var a=it.price*cart[id];tot+=a;
  l+='<div class="line"><div class="n">'+esc(it.name)+'</div><div class="r"><div class="q"><button onclick="chg(\''+id+'\',-1)">−</button><b>'+cart[id]+'</b><button onclick="chg(\''+id+'\',1)">+</button></div><b>₹'+a+'</b></div></div>'});
 return '<div class="pos"><div class="left">'+h+'</div><div class="right"><div class="mut">Current order</div><div class="cart">'+(l||'<div class="empty">Tap items to add</div>')+'</div><div class="total"><span>Total</span><span>₹'+tot+'</span></div><div class="pay"><button class="cash" '+(tot?'':'disabled')+' onclick="pay(\'Cash\')">Cash</button><button class="gpay" '+(tot?'':'disabled')+' onclick="pay(\'G-Pay\')">G-Pay</button></div><button class="clr" onclick="cart={};render()">Clear order</button></div></div>';
}
function isDrink(it){return it.drink!==undefined?it.drink:/beverage|drink/i.test(it.cat||'')}
function lineDrink(x){if(x.drink!==undefined)return x.drink;var it=items.find(function(i){return i.name==x.name});return it?isDrink(it):/beverage|drink|water|bottle/i.test(x.name)}
function add(id){cart[id]=(cart[id]||0)+1;render()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()}
function pay(mode){
 var lines=[],tot=0;
 Object.keys(cart).forEach(function(id){var it=items.find(function(x){return x.id==id});if(it){lines.push({name:it.name,price:it.price,qty:cart[id],drink:isDrink(it)});tot+=it.price*cart[id]}});
 if(!lines.length)return;
 var now=new Date();
 sales.push({id:now.getTime(),ts:now.getTime(),date:dstr(now),items:lines,total:tot,mode:mode});
 save(KS,sales);cart={};toast('Saved ₹'+tot+' · '+mode);render();
}
/* ORDERS */
function dateBar(){return '<div class="row card"><button class="btn g" onclick="shift(-1)">‹</button><input type="date" value="'+viewDate+'" onchange="viewDate=this.value||today();render()"><button class="btn g" onclick="shift(1)">›</button></div>'}
function shift(n){var p=viewDate.split('-'),d=new Date(p[0],p[1]-1,+p[2]+n);viewDate=dstr(d);render()}
function histV(){
 var list=sales.filter(function(s){return s.date==viewDate}).sort(function(a,b){return b.ts-a.ts});
 var h=dateBar()+'<div class="mut" style="margin-bottom:8px">'+list.length+' orders on '+nice(viewDate)+'</div>';
 if(!list.length)h+='<div class="empty">No orders this day</div>';
 list.forEach(function(s,i){
  h+='<div class="card"><div class="row"><b>#'+(list.length-i)+' · '+tm(s.ts)+'</b><span class="pill '+(s.mode=='Cash'?'c':'o')+'">'+s.mode+'</span></div>'+
  s.items.map(function(x){return '<div class="row mut" style="font-size:13px"><span>'+esc(x.name)+' × '+x.qty+'</span><span>₹'+x.price*x.qty+'</span></div>'}).join('')+
  '<div class="row" style="margin-top:6px"><b>₹'+s.total+'</b><button class="btn '+(armed==s.id?'d':'g')+'" onclick="del('+s.id+')">'+(armed==s.id?'Tap again to delete':'Delete')+'</button></div></div>'});
 return '<div class="page">'+h+'</div>';
}
function del(id){if(armed==id){sales=sales.filter(function(s){return s.id!=id});save(KS,sales);armed=null}else armed=id;render()}
/* REPORT */
function repV(){
 var list=sales.filter(function(s){return s.date==viewDate}),cash=0,onl=0,dishes=0,drinks=0,dR=0,bR=0,by={};
 list.forEach(function(s){if(s.mode=='Cash')cash+=s.total;else onl+=s.total;s.items.forEach(function(x){var d=lineDrink(x);if(d){drinks+=x.qty;bR+=x.qty*x.price}else{dishes+=x.qty;dR+=x.qty*x.price}by[x.name]=by[x.name]||{q:0,r:0,d:d};by[x.name].q+=x.qty;by[x.name].r+=x.qty*x.price})});
 var h=dateBar()+'<div class="stats"><div class="stat big"><div class="mut">Total revenue · '+nice(viewDate)+' · '+list.length+' orders</div><div class="v">₹'+(cash+onl)+'</div></div>'+
 '<div class="stat"><div class="mut">Cash</div><div class="v">₹'+cash+'</div></div><div class="stat"><div class="mut">Online (G-Pay)</div><div class="v">₹'+onl+'</div></div>'+
 '<div class="stat"><div class="mut">Dishes sold (Ghoghra + Fries)</div><div class="v">'+dishes+'</div><div class="mut">₹'+dR+'</div></div><div class="stat"><div class="mut">Beverages sold</div><div class="v">'+drinks+'</div><div class="mut">₹'+bR+'</div></div></div>';
 function grp(t,flag){var ks=Object.keys(by).filter(function(n){return by[n].d==flag}),q=0,r=0;var rows=ks.map(function(n){q+=by[n].q;r+=by[n].r;return '<tr><td>'+esc(n)+'</td><td>'+by[n].q+'</td><td>'+by[n].r+'</td></tr>'}).join('')||'<tr><td colspan="3" class="mut">No sales</td></tr>';return '<tr><th colspan="3" style="background:var(--pri2);color:var(--pri)">'+t+'</th></tr>'+rows+'<tr><td><b>Total '+t+'</b></td><td><b>'+q+'</b></td><td><b>'+r+'</b></td></tr>'}
 h+='<div class="card"><h3 style="margin-top:0">Item-wise sale</h3><table><tr><th>Item</th><th>Qty</th><th>₹</th></tr>'+grp('Dishes',false)+grp('Beverages',true)+'</table></div>';
 var days={};
 sales.forEach(function(s){var d=days[s.date]=days[s.date]||{o:0,q:0,dr:0,c:0,n:0};d.o++;s.items.forEach(function(x){if(lineDrink(x))d.dr+=x.qty;else d.q+=x.qty});if(s.mode=='Cash')d.c+=s.total;else d.n+=s.total});
 var ks=Object.keys(days).sort().reverse();
 h+='<div class="card"><h3 style="margin-top:0">All days (tap to open)</h3><table><tr><th>Date</th><th>Dishes</th><th>Drinks</th><th>Cash</th><th>Online</th><th>Total</th></tr>'+
 (ks.map(function(k){var d=days[k];return '<tr onclick="viewDate=\''+k+'\';render()" style="'+(k==viewDate?'font-weight:800':'')+'"><td>'+nice(k)+'</td><td>'+d.q+'</td><td>'+d.dr+'</td><td>'+d.c+'</td><td>'+d.n+'</td><td>'+(d.c+d.n)+'</td></tr>'}).join('')||'<tr><td colspan="6" class="mut">Nothing yet</td></tr>')+'</table></div>';
 return '<div class="page">'+h+'</div>';
}
/* ITEMS */
function itemsV(){
 var h='<div class="card"><b>Add new item</b><div class="row" style="margin-top:8px;flex-wrap:wrap"><input id="nn" placeholder="Item name" style="flex:2;min-width:120px"><input id="np" type="number" inputmode="numeric" placeholder="₹ Price" style="flex:1;min-width:70px"></div><input id="nc" placeholder="Category (e.g. Ghoghra, Drinks)" style="width:100%;margin-top:8px"><select id="nt" style="width:100%;margin-top:8px"><option value="0">Type: Dish (counted in dishes)</option><option value="1">Type: Beverage (counted separately)</option></select><button class="btn" style="width:100%;margin-top:8px" onclick="addItem()">+ Add item</button></div>';
 items.forEach(function(i){h+='<div class="card"><div class="row"><div><b>'+esc(i.name)+'</b><div class="mut">'+esc(i.cat)+'</div><button class="btn g" style="padding:3px 8px;font-size:12px;margin-top:4px" onclick="togType(\''+i.id+'\')">'+(isDrink(i)?'Beverage':'Dish')+' ⇄</button></div><div class="row"><span>₹</span><input type="number" inputmode="numeric" value="'+i.price+'" style="width:72px" onchange="setPrice(\''+i.id+'\',this.value)"><button class="btn '+(armed==i.id?'d':'g')+'" onclick="delItem(\''+i.id+'\')">'+(armed==i.id?'Sure?':'✕')+'</button></div></div></div>'});
 h+='<button class="btn g" style="width:100%" onclick="openInst()">Add app to Home Screen</button>';
 h+='<div class="mut" style="text-align:center;padding:8px">Data is saved in this phone\'s browser. Old sales keep their old prices when you change a price.</div>';
 return '<div class="page">'+h+'</div>';
}
function addItem(){
 var n=document.getElementById('nn').value.trim(),p=parseFloat(document.getElementById('np').value),c=document.getElementById('nc').value.trim()||'Other';
 if(!n||isNaN(p)||p<0){toast('Enter name and price');return}
 items.push({id:'u'+Date.now(),name:n,price:p,cat:c,drink:document.getElementById('nt').value=='1'});save(KI,items);toast('Item added');render();
}
function togType(id){var it=items.find(function(x){return x.id==id});if(it){it.drink=!isDrink(it);save(KI,items);render()}}
function setPrice(id,v){var p=parseFloat(v);var it=items.find(function(x){return x.id==id});if(it&&!isNaN(p)&&p>=0){it.price=p;save(KI,items);toast('Price updated')}}
function delItem(id){if(armed==id){items=items.filter(function(x){return x.id!=id});delete cart[id];save(KI,items);armed=null}else armed=id;render()}

/* INSTALL POPUP */
var dp=null;
function mkIcon(){var c=document.createElement('canvas');c.width=c.height=180;var x=c.getContext('2d');x.fillStyle='#173d2e';x.fillRect(0,0,180,180);x.strokeStyle='#b08d3c';x.lineWidth=6;x.strokeRect(12,12,156,156);x.fillStyle='#f3e7c3';x.font='bold 100px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('N',90,98);return c.toDataURL('image/png')}
var iconUrl='';try{iconUrl=mkIcon();document.getElementById('icn').src=iconUrl}catch(e){}
function standalone(){return window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)}
function openInst(){
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 var st=document.getElementById('steps'),b=document.getElementById('inb');
 if(dp){st.innerHTML='';b.style.display='block'}
 else{b.style.display='none';st.innerHTML=ios?'<ol><li>Open this page in <b>Safari</b></li><li>Tap the <b>Share</b> button (square with arrow)</li><li>Tap <b>Add to Home Screen</b></li><li>Tap <b>Add</b></li></ol>':'<ol><li>Open this page in <b>Chrome</b></li><li>Tap the <b>⋮</b> menu (top right)</li><li>Tap <b>Add to Home screen</b> / <b>Install app</b></li><li>Tap <b>Add</b></li></ol>'}
 document.getElementById('ov').className='ov s';
}
function closeInst(remember){document.getElementById('ov').className='ov';if(remember){try{localStorage.setItem('inst_seen',today())}catch(e){}}}
function doInstall(){if(!dp)return;dp.prompt();dp.userChoice.then(function(){dp=null;closeInst(true)})}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e});
window.addEventListener('appinstalled',function(){closeInst(true)});
setTimeout(function(){var seen=null;try{seen=localStorage.getItem('inst_seen')}catch(e){}if(!standalone()&&seen!=today())openInst()},1200);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
render();
</script>
</body>
</html>
